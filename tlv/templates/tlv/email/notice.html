<!doctype html>
<html><body style="margin:0;padding:0;background:#f3f5f8;font-family:Arial,Helvetica,sans-serif;color:#14213d">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f5f8;padding:24px 12px"><tr><td align="center">
  <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background:#ffffff;border-radius:10px">
    <tr><td style="padding:22px 28px 0;font-size:18px;font-weight:bold;color:#14213d"><span style="color:#e0362c">&#9679;</span> Todas las Voces</td></tr>
    <tr><td style="padding:18px 28px 6px;font-size:22px;line-height:1.25;font-weight:bold">{{ title }}</td></tr>
    {% if body %}<tr><td style="padding:6px 28px;font-size:16px;line-height:1.55;color:#3a4763">{{ body|linebreaksbr }}</td></tr>{% endif %}
    {% if link %}<tr><td style="padding:16px 28px 6px"><a href="{{ link }}" style="display:inline-block;background:#14213d;color:#ffffff;text-decoration:none;font-weight:bold;font-size:15px;padding:11px 18px;border-radius:6px">{{ button }}</a></td></tr>
    <tr><td style="padding:6px 28px;font-size:13px;color:#667085;word-break:break-all">{{ link }}</td></tr>{% endif %}
    <tr><td style="padding:18px 28px 24px;font-size:13px;color:#667085;border-top:1px solid #e1e5ec">{{ footer }}</td></tr>
  </table>
</td></tr></table>
</body></html>
